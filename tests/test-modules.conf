worker_processes 1;
pid /tmp/nginx-modules.pid;
error_log stderr notice;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type text/plain;
    access_log off;
    brotli on;
    brotli_min_length 256;
    brotli_static on;
    gzip on;
    gzip_min_length 256;
    proxy_cache_path /tmp/proxy-cache keys_zone=testcache:1m;
    slowfs_cache_path /tmp/slowfs-cache keys_zone=testslow:1m;
    server {
        listen 18081;
        root /usr/share/nginx/html;
        location / { }
        location /listing/ { alias /usr/share/nginx/html/; fancyindex on; index __no_index__; }
        location /subs { proxy_pass http://127.0.0.1:18082/; subs_filter_types text/plain; subs_filter 'original' 'replaced'; }
        location ~ ^/purge(/.*)$ { proxy_cache_purge testcache $1; }
        location /slow/ { alias /usr/share/nginx/html/; slowfs_cache testslow; slowfs_cache_key $uri; slowfs_cache_valid 200 1m; }
        location /cached/ { proxy_pass http://127.0.0.1:18082/; proxy_cache testcache; proxy_cache_key $uri; proxy_cache_valid 200 1m; add_header X-Cache $upstream_cache_status always; }
    }
    server { listen 18082; location / { return 200 'original'; } }
}
