name: Build, test and publish
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['locks/**', 'scripts/**', 'tests/**', 'patches/**', 'runtime/**', 'Dockerfile', '.github/workflows/**']
  pull_request:
    paths: ['locks/**', 'scripts/**', 'tests/**', 'patches/**', 'runtime/**', 'Dockerfile', '.github/workflows/**']
concurrency:
  group: nginx-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover updates
        if: github.event_name == 'schedule'
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Select plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REVIEW: ${{ steps.update.outputs.review }}
          SHOULD_BUILD: ${{ steps.update.outputs.should_build }}
          REASON: ${{ steps.update.outputs.reason }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo "Schedule plan: should_build=${SHOULD_BUILD} review=${REVIEW} reason=${REASON}"
            if [ "$SHOULD_BUILD" = true ]; then
              echo build=true >> "$GITHUB_OUTPUT"
            else
              echo build=false >> "$GITHUB_OUTPUT"
            fi
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi
      - name: Open review PR for cross-series or entrypoint updates
        if: steps.update.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          set -euo pipefail
          CHANGES=$(python3 -c "import json; d=json.load(open('update-result.json')); print(', '.join(d.get('changes', [])) or 'unknown')")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin automation/component-review || true
          PR_URL=$(gh pr list --head automation/component-review --state open --json url --jq '.[0].url // empty')
          if [ -n "$PR_URL" ] && git rev-parse --verify origin/automation/component-review >/dev/null 2>&1; then
            if python3 -c "
          import json, subprocess
          prev = json.loads(subprocess.check_output(['git', 'show', 'origin/automation/component-review:locks/components.json']))
          curr = json.load(open('locks/components.json'))
          for d in (prev, curr):
              d.get('git', {}).pop('boringssl', None)
          raise SystemExit(0 if prev == curr else 1)
          "; then
              echo "Review PR already covers current non-BoringSSL changes: $PR_URL (skipping duplicate push and notification)"
              exit 0
            fi
          fi
          git checkout -b automation/component-review
          git add locks/components.json
          git commit -m 'Update component locks requiring review'
          git push --force-with-lease origin HEAD:automation/component-review
          if [ -z "$PR_URL" ]; then
            PR_BODY=$(printf '@ticifer 上游组件存在需要人工审核的变更（跨系列升级或 `entrypoint/` 变更），本轮已暂停自动发布，线上镜像标签保持不变。\n\n- 变更项：`%s`\n- 请先确认兼容性，并在该分支运行工作流验证两版镜像；验证通过后合并 PR 即可自动触发发布。' "$CHANGES")
            PR_URL=$(gh pr create --head automation/component-review --assignee ticifer --title "Review component upgrade (${CHANGES})" --body "$PR_BODY")
            NOTIFY_TITLE="nginx-brotli-quic 需要手动审核 PR"
            NOTIFY_BODY="检测到需审核更新（${CHANGES}），已暂停自动发版，点击直达 PR。"
          else
            gh pr edit "$PR_URL" --add-assignee ticifer --title "Review component upgrade (${CHANGES})" || true
            gh pr comment "$PR_URL" --body "@ticifer 审核分支已同步新的上游变更：\`${CHANGES}\`，请重新确认兼容性并验证后合并。"
            NOTIFY_TITLE="nginx-brotli-quic 审核 PR 有新更新"
            NOTIFY_BODY="待审核 PR 已同步新变更（${CHANGES}），点击直达 PR。"
          fi
          python3 scripts/notify.py --title "$NOTIFY_TITLE" --body "$NOTIFY_BODY" --url "$PR_URL" --level timeSensitive
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.build == 'true'
        with:
          name: component-lock
          path: locks/components.json
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [boringssl, openssl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: component-lock
          path: locks
      - run: bash scripts/deps.sh
      - run: python3 scripts/fetch.py
      - run: bash scripts/build.sh '${{ matrix.variant }}'
      - run: bash scripts/image.sh '${{ matrix.variant }}'
      - run: bash tests/verify.sh 'nginx-ci:${{ matrix.variant }}'
      - name: Save validated image
        run: docker save 'nginx-ci:${{ matrix.variant }}' -o 'work/${{ matrix.variant }}.tar'
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}
          path: work/${{ matrix.variant }}.tar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-record-${{ matrix.variant }}
          path: work/output/nginx-version.txt
          if-no-files-found: ignore
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: component-lock
          path: locks
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: work/images
          merge-multiple: true
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish both variants and sync Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_ID: ${{ github.run_id }}
        run: python3 scripts/publish.py
      - name: Record successfully published locks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locks/components.json README.md releases/
          if ! git diff --cached --quiet; then
            git commit -m 'Record validated image release [skip ci]'
            git push origin HEAD:main
          fi
      - name: Publish dual-image GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
  failure:
    needs: [prepare, build, publish]
    if: always() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ISSUE_URL=$(gh issue create --assignee ticifer --title 'Automated image iteration failed' --body "@ticifer Review the failed run: ${RUN_URL} . No failed build is eligible for publication.")
          python3 scripts/notify.py --title "nginx-brotli-quic 自动构建失败" --body "构建、测试或发布失败，未影响线上标签，点击查看失败记录。" --url "$ISSUE_URL" --level timeSensitive
